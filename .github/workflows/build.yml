name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Install app dependencies
        run: npm ci

      - name: Bundle dedicated Node runtime (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          rm -rf vendor/node-runtime
          mkdir -p vendor/node-runtime
          cp "$(command -v node)" vendor/node-runtime/node
          chmod +x vendor/node-runtime/node
          vendor/node-runtime/node --version

      - name: Bundle dedicated Node runtime (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          if (Test-Path vendor/node-runtime) { Remove-Item -Recurse -Force vendor/node-runtime }
          New-Item -ItemType Directory -Force -Path vendor/node-runtime | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node vendor/node-runtime/node.exe
          & vendor/node-runtime/node.exe --version

      - name: Build full OpenAI tunnel-client (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          rm -rf .tmp-tunnel-client vendor/tunnel-client
          git clone --depth 1 --branch v0.0.15 https://github.com/openai/tunnel-client.git .tmp-tunnel-client
          mkdir -p vendor/tunnel-client
          cd .tmp-tunnel-client
          go build -o ../vendor/tunnel-client/tunnel-client ./cmd/client
          chmod +x ../vendor/tunnel-client/tunnel-client

      - name: Build full OpenAI tunnel-client (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          if (Test-Path .tmp-tunnel-client) { Remove-Item -Recurse -Force .tmp-tunnel-client }
          if (Test-Path vendor/tunnel-client) { Remove-Item -Recurse -Force vendor/tunnel-client }
          git clone --depth 1 --branch v0.0.15 https://github.com/openai/tunnel-client.git .tmp-tunnel-client
          New-Item -ItemType Directory -Force -Path vendor/tunnel-client | Out-Null
          Push-Location .tmp-tunnel-client
          go build -o ../vendor/tunnel-client/tunnel-client.exe ./cmd/client
          Pop-Location

      - name: Verify JavaScript
        run: npm run check

      - name: Build Linux installers
        if: matrix.target == 'linux'
        run: npm run dist:linux

      - name: Build Windows installer
        if: matrix.target == 'win'
        run: npm run dist:win

      - name: Verify packaged Node runtime (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          test -x dist/linux-unpacked/resources/node-runtime/node
          OUTPUT="$(dist/linux-unpacked/resources/node-runtime/node -p 'process.versions.node')"
          test -n "$OUTPUT"
          echo "Bundled Node runtime OK: Node $OUTPUT"

      - name: Verify Linux Local MCP HTTP server
        if: matrix.target == 'linux'
        shell: bash
        run: |
          CONFIG="$RUNNER_TEMP/local-roots.json"
          LOG="$RUNNER_TEMP/local-mcp-http.log"
          PORT=38475
          printf '%s\n' '{"roots":{"tmp":{"path":"/tmp","mode":"read-write"}}}' > "$CONFIG"
          LOCAL_FOLDER_MCP_CONFIG="$CONFIG" \
          LOCAL_MCP_HTTP_PORT="$PORT" \
          ENABLE_WRITE=true \
          dist/linux-unpacked/resources/node-runtime/node \
            dist/linux-unpacked/resources/app/bundled/local-mcp/server.js \
            >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          OK=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$PORT/health" | grep -q '"ok":true'; then
              OK=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 0.25
          done
          if [ "$OK" -ne 1 ]; then
            cat "$LOG"
            exit 1
          fi

          INIT_BODY='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
          INIT_RESPONSE="$(curl -fsS -X POST "http://127.0.0.1:$PORT/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$INIT_BODY")"
          echo "$INIT_RESPONSE" | grep -q '"result"'

          TOOLS_BODY='{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          TOOLS_RESPONSE="$(curl -fsS -X POST "http://127.0.0.1:$PORT/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data "$TOOLS_BODY")"
          echo "$TOOLS_RESPONSE" | grep -q '"tools"'
          echo "$TOOLS_RESPONSE" | grep -q '"list_roots"'

          echo "Linux Local MCP HTTP initialize/tools-list smoke test passed."

      - name: Verify packaged Node runtime (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $exe = "dist/win-unpacked/resources/node-runtime/node.exe"
          if (-not (Test-Path $exe)) { throw "Bundled Node runtime not found: $exe" }
          $output = & $exe -p "process.versions.node"
          if ([string]::IsNullOrWhiteSpace($output)) { throw "Bundled Node runtime returned no version." }
          Write-Host "Bundled Node runtime OK: Node $output"

      - name: Create SHA-256 checksums (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          for f in dist/*.deb dist/*.AppImage; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create SHA-256 checksums (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MCP-Bridge-${{ matrix.target }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v0.2.8 Web MCP lifecycle fix')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.8' }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.sha256
